<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>さいごのクイズ</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    img {
      width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .text-area {
      margin-top: 16px;
      text-align: center;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
    }

    .intro-line {
      margin-bottom: 12px;
    }

    .intro-tap {
      opacity: 0.85;
    }

    .choices {
      margin-top: 16px;
      display: none;
    }

    .question {
  text-align: center;
  font-weight: bold;
  margin-bottom: 20px;
  font-size: 22px;
}


    .choice {
      margin: 8px 0;
      padding: 10px;
      background: #eee;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-size: 18px;
    }

    .choice:hover {
      background: #ddd;
    }

    .result {
      margin-top: 16px;
      font-size: 18px;
      text-align: center;
      display: none;
      cursor: pointer;
    }

    /* 正解時 */
    .correct {
      font-weight: bold;
      font-size: 28px;
    }

    .correct-line {
      margin-bottom: 12px;
    }

    .answer-red {
      color: red;
    }

    /* スマホ用 */
    @media (max-width: 768px) {
      #intro,
      .result {
        font-size: 36px;
        line-height: 1.4;
      }

      .choice {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="image/kuromi2.jpg" alt="クイズ画像">

    <div id="intro" class="text-area">
      <div class="intro-line">ここまでよくたどりついたね</div>
      <div class="intro-line intro-tap">さいごのクイズをといてみな！(ここをタップ)</div>
    </div>

<div id="quiz" class="choices">
  <div class="question">
    問題：ミャクミャクの青い部分は何を表している？
  </div>

  <div class="choice" data-answer="1">① そら</div>
  <div class="choice" data-answer="2">② からだ</div>
  <div class="choice" data-answer="3">③ あおいちきゅう</div>
  <div class="choice" data-answer="4">④ きよいみず</div>
  <div class="choice" data-answer="5">⑤ きれいなほうせき</div>
</div>


    <div id="result" class="result"></div>
  </div>

  <script>
    const intro = document.getElementById("intro");
    const quiz = document.getElementById("quiz");
    const result = document.getElementById("result");
    const correctAnswer = "4";

    intro.addEventListener("click", () => {
      intro.style.display = "none";
      quiz.style.display = "block";
    });

    document.querySelectorAll(".choice").forEach(choice => {
      choice.addEventListener("click", () => {
        quiz.style.display = "none";
        result.style.display = "block";
        result.classList.remove("correct");

        if (choice.dataset.answer === correctAnswer) {
          result.innerHTML = `
            <div class="correct-line">せいかい！</div>
            <div class="correct-line">
              おたからは<span class="answer-red">たたみのマットのした</span>
            </div>
          `;
          result.classList.add("correct");
        } else {
          result.textContent = "ぶぶー（タップでもういちど）";
        }
      });
    });

    result.addEventListener("click", () => {
      if (result.textContent.startsWith("ぶぶー")) {
        result.style.display = "none";
        quiz.style.display = "block";
      }
    });
  </script>
</body>
</html>
